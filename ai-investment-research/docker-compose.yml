# 僅供本機開發的 PostgreSQL，不涉及任何雲端資源。
# 首次建立 volume 時會自動執行 database/migrations/*.sql；
# 之後新增的 migration 需手動以 psql 套用。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ai_research
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
